# Built locally by `just up`; set DNS_IMAGE to pull from a registry instead.
x-dns-image: &dns-image
  image: ${DNS_IMAGE:-caddy-local-dns:latest}
  build: ./dns

services:
  caddy:
    image: lucaslorentz/caddy-docker-proxy:ci-alpine
    ports:
      - 80:80
      - 443:443/tcp
      - 443:443/udp
    environment:
      - CADDY_INGRESS_NETWORKS=caddy
      - CADDY_DOCKER_CADDYFILE_PATH=/etc/caddy/Caddyfile
    networks:
      - caddy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./caddy_data:/data
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    restart: unless-stopped

  dns:
    <<: *dns-image
    ports:
      - 127.0.0.1:${DNS_PORT:-5300}:5300/udp
      - 127.0.0.1:${DNS_PORT:-5300}:5300/tcp
    restart: unless-stopped

  dns-sync:
    <<: *dns-image
    command: python3 /app/sync_resolvers.py
    depends_on:
      - dns
    environment:
      - DNS_PORT=${DNS_PORT:-5300}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - type: bind
        source: ${RESOLVER_DIR:-/private/etc/resolver}
        target: /resolver
        bind:
          create_host_path: false
    restart: unless-stopped

  dns-web:
    <<: *dns-image
    command: python3 /app/web.py
    environment:
      - CADDY_NETWORK=caddy
    labels:
      caddy: resolver.localhost
      caddy.reverse_proxy: "{{upstreams 8080}}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - type: bind
        source: ${RESOLVER_DIR:-/private/etc/resolver}
        target: /resolver
        read_only: true
        bind:
          create_host_path: false
    networks:
      - caddy
      - default
    restart: unless-stopped

networks:
  caddy:
    external: true
